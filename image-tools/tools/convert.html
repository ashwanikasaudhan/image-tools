<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convert Image</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="nav"></div>
<main class="container">
  <h1>Convert Image</h1>
  <div class="card">
    <h3>1. Choose Image</h3>
    <div class="drop" id="drop">
      <p>Drag and drop an image here, or</p>
      <input type="file" id="file" accept="image/*">
    </div>
    <p class="info" id="info"></p>
  </div>
  <div class="card">
    <h3>2. Convert To</h3>
    <div class="row">
      <label class="field">Format
        <select id="fmt">
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
      </label>
      <label class="field">Quality: <span id="qv">92</span>%
        <input type="range" id="q" min="10" max="100" value="92">
      </label>
    </div>
    <div class="row">
      <label class="field">Target size (optional)<input type="number" id="ts" min="1" placeholder="e.g. 500"></label>
      <label class="field">Unit
        <select id="tu"><option value="KB">KB</option><option value="MB">MB</option></select>
      </label>
    </div>
    <p class="note">When a target size is set, quality is chosen automatically. Target size works for JPG and WebP. Transparent areas become white in JPG.</p>
    <button class="btn" id="go">Convert →</button>
    <p class="msg" id="msg"></p>
  </div>
  <div class="card" id="resultCard" hidden>
    <h3>Result</h3>
    <img id="out" class="preview" alt="Converted image">
    <p class="info" id="resultInfo"></p>
    <button class="btn" id="dl">⬇ Download</button>
  </div>
</main>
<script src="shared.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let img = null;

  $("q").addEventListener("input", () => { $("qv").textContent = $("q").value; });

  function targetBytes() {
    const v = Number($("ts").value);
    return v ? v * ($("tu").value === "MB" ? 1048576 : 1024) : 0;
  }

  setupDrop($("drop"), $("file"), async function (f) {
    if (!f.type.startsWith("image/")) { $("msg").textContent = "Please choose an image."; return; }
    $("msg").textContent = "";
    img = await loadImage(f);
    $("info").textContent = img.width + " x " + img.height + " · " + fmtSize(f.size);
    $("resultCard").hidden = true;
  });

  $("go").addEventListener("click", function () {
    if (!img) { $("msg").textContent = "Choose an image first."; return; }
    const c = document.createElement("canvas");
    c.width = img.width;
    c.height = img.height;
    c.getContext("2d").drawImage(img, 0, 0);
    output(c, $("fmt").value, $("q").value / 100, targetBytes());
  });
</script>
</body>
</html>

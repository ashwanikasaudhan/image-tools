<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watermark Image</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="nav"></div>
<main class="container">
  <h1>Watermark Image</h1>
  <div class="card">
    <h3>1. Choose Image</h3>
    <div class="drop" id="drop">
      <p>Drag and drop an image here, or</p>
      <input type="file" id="file" accept="image/*">
    </div>
    <p class="info" id="info"></p>
  </div>
  <div class="card">
    <h3>2. Watermark Settings</h3>
    <div class="row">
      <label class="field">Text<input type="text" id="text" value="© Your Name" style="width:200px"></label>
      <label class="field">Font size (px)<input type="number" id="size" value="48" min="8"></label>
      <label class="field">Color<input type="color" id="color" value="#ffffff"></label>
      <label class="field">Position
        <select id="pos">
          <option value="center">Center</option>
          <option value="top-left">Top left</option>
          <option value="top-right">Top right</option>
          <option value="bottom-left">Bottom left</option>
          <option value="bottom-right" selected>Bottom right</option>
        </select>
      </label>
    </div>
    <label class="field">Opacity: <span id="ov">50</span>%
      <input type="range" id="opacity" min="5" max="100" value="50">
    </label>
    <canvas id="preview" class="preview"></canvas>
    <div class="row">
      <label class="field">Format
        <select id="fmt">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/webp">WebP</option>
        </select>
      </label>
      <button class="btn" id="go">Save →</button>
    </div>
    <p class="msg" id="msg"></p>
  </div>
  <div class="card" id="resultCard" hidden>
    <h3>Result</h3>
    <img id="out" class="preview" alt="Watermarked image">
    <p class="info" id="resultInfo"></p>
    <button class="btn" id="dl">⬇ Download</button>
  </div>
</main>
<script src="shared.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let img = null;

  function draw() {
    if (!img) return;
    const c = $("preview");
    c.width = img.width;
    c.height = img.height;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0);

    const size = Math.max(8, +$("size").value || 48);
    const pad = Math.round(size * 0.5);
    const pos = $("pos").value;
    ctx.font = "bold " + size + "px Arial";
    ctx.textBaseline = "middle";
    ctx.fillStyle = $("color").value;
    ctx.globalAlpha = $("opacity").value / 100;

    const tw = ctx.measureText($("text").value).width;
    const x = pos.includes("left") ? pad : pos.includes("right") ? c.width - tw - pad : (c.width - tw) / 2;
    const y = pos.startsWith("top") ? pad + size / 2 : pos.startsWith("bottom") ? c.height - pad - size / 2 : c.height / 2;
    ctx.fillText($("text").value, x, y);
    ctx.globalAlpha = 1;
  }

  ["text", "size", "color", "pos", "opacity"].forEach(id => $(id).addEventListener("input", draw));
  $("opacity").addEventListener("input", () => { $("ov").textContent = $("opacity").value; });

  setupDrop($("drop"), $("file"), async function (f) {
    if (!f.type.startsWith("image/")) { $("msg").textContent = "Please choose an image."; return; }
    $("msg").textContent = "";
    img = await loadImage(f);
    $("info").textContent = img.width + " x " + img.height + " · " + fmtSize(f.size);
    $("resultCard").hidden = true;
    draw();
  });

  $("go").addEventListener("click", function () {
    if (!img) { $("msg").textContent = "Choose an image first."; return; }
    output($("preview"), $("fmt").value);
  });
</script>
</body>
</html>
